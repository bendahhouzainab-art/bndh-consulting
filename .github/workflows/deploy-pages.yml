name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Skip the postinstall browser download (only needed for CodeYam captures).
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        # The site never touches the database, but app/lib/prisma.ts is still
        # type-checked during the build and needs the generated client types.
        run: npx prisma generate

      - name: Remove dev-only CodeYam routes
        # These routes only serve the CodeYam editor preview and 404 in
        # production. They cannot be statically exported, and they must not
        # ship, so drop them from this throwaway CI checkout.
        run: rm -rf app/api app/scenario app/codeyam-isolate

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
